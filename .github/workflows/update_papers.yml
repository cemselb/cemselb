name: Update Publications

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly sync
  workflow_dispatch: 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-publications:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Format ORCID Publications
        run: |
          # Fetch ORCID data
          curl -H "Accept: application/json" "https://pub.orcid.org/v3.0/0000-0002-2365-1194/works" > orcid.json
          
          # Initialize the file
          echo "# Research Publications" > PUBLICATIONS.md
          echo "Latest research findings for Cemsel Bafligil Suomi synced from [ORCID: 0000-0002-2365-1194](https://orcid.org/0000-0002-2365-1194)." >> PUBLICATIONS.md
          echo "" >> PUBLICATIONS.md
          echo "Last updated: $(date +'%Y-%m-%d')" >> PUBLICATIONS.md
          echo "" >> PUBLICATIONS.md
          
          # Extract and format titles/years
          jq -r '.group[] | .["work-summary"][0] | "- **" + .title.title.value + "** (" + (."publication-date".year.value // "n.d.") + ")"' orcid.json >> PUBLICATIONS.md

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add PUBLICATIONS.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update publication list from ORCID" && git push)
