name: Update Publications

on:
  schedule:
    - cron: '0 0 * * 0' # Runs every Sunday at midnight
  workflow_dispatch: # Allows to run it manually

jobs:
  update-publications:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Essential for the bot to save the file
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Format ORCID Publications
        run: |
          # 1. Fetch the data from ORCID
          curl -H "Accept: application/json" "https://pub.orcid.org/v3.0/0000-0002-2365-1194/works" > orcid.json
          
          # 2. Initialize the PUBLICATIONS.md file
          echo "# Research Publications" > PUBLICATIONS.md
          echo "Latest research findings for Cemsel Bafligil Suomi, PhD, synced from [ORCID: 0000-0002-2365-1194](https://orcid.org/0000-0002-2365-1194)." >> PUBLICATIONS.md
          echo "" >> PUBLICATIONS.md
          echo "Last updated: $(date +'%Y-%m-%d')" >> PUBLICATIONS.md
          echo "" >> PUBLICATIONS.md
          
          # 3. Extract titles and years using jq
          jq -r '.group[] | .["work-summary"][0] | "- **" + .title.title.value + "** (" + (."publication-date".year.value // "n.d.") + ")"' orcid.json >> PUBLICATIONS.md

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add PUBLICATIONS.md
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update publication list from ORCID" && git push)
