name: Update Publications
on:
  schedule:
    - cron: "0 0 * * 0" 
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Research publications from ORCID
        uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED 
          base: ""
          plugin_research: yes
          plugin_research_limit: 10
          plugin_research_id: 0000-0002-2365-1194
          filename: PUBLICATIONS.md
          output_action: commit
          committer_gist: ${{ dev.cemselb }} 
