name: Update Publications

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch: 

jobs:
  update-publications:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get ORCID Publications
        uses: rmostafa/get-orcid-publications@v1
        with:
          orcid_id: '0000-0002-2365-1194'
          file_path: 'PUBLICATIONS.md'

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add PUBLICATIONS.md
          # Only commit if there are actually changes to avoid errors
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update publication list from ORCID" && git push)
